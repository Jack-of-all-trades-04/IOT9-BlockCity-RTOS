; PlatformIO Project Configuration File
; BlockCity RTOS: ESP32-1 (Land A), ESP32-2 (Land B), ESP32-CAM (FOMO Vision)

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1

[env:block_a]
board = nodemcu-32s
board_build.partitions = huge_app.csv
build_src_filter = +<block_a/>
lib_deps =
    alteriom/AlteriomPainlessMesh @ ^2.1.1
    blynkkk/Blynk @ ^1.4.0
    adafruit/DHT sensor library @ ^1.4.7
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    bblanchon/ArduinoJson @ ^7.0.0

[env:block_b]
board = nodemcu-32s
board_build.partitions = huge_app.csv
build_src_filter = +<block_b/>
lib_deps =
    alteriom/AlteriomPainlessMesh @ ^2.1.1
    adafruit/DHT sensor library @ ^1.4.7
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    bblanchon/ArduinoJson @ ^7.0.0

[env:esp32_cam]
board = esp32cam
board_build.partitions = huge_app.csv
monitor_rts = 0
monitor_dtr = 0
build_src_filter = +<esp32_cam/>
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCAMERA_MODEL_AI_THINKER
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
